name: Nightly Supabase disaster backup

on:
  schedule:
    # GitHub schedules use UTC. This is 1:23 AM MST / 2:23 AM MDT.
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firevault-nightly-disaster-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_STORAGE_ENDPOINT: https://${{ vars.SUPABASE_PROJECT_REF }}.storage.supabase.co/storage/v1/s3
      SUPABASE_STORAGE_REGION: ${{ vars.SUPABASE_STORAGE_REGION }}
      SUPABASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.SUPABASE_STORAGE_ACCESS_KEY_ID }}
      SUPABASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_STORAGE_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
      BACKUP_ENCRYPTION_SALT: ${{ secrets.BACKUP_ENCRYPTION_SALT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install rclone
        env:
          RCLONE_VERSION: 1.75.1
          RCLONE_SHA256: 982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab
        run: |
          archive="rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          curl --fail --silent --show-error --location \
            "https://downloads.rclone.org/v${RCLONE_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          echo "${RCLONE_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          unzip -q "${RUNNER_TEMP}/${archive}" -d "${RUNNER_TEMP}"
          sudo install -m 0755 \
            "${RUNNER_TEMP}/rclone-v${RCLONE_VERSION}-linux-amd64/rclone" \
            /usr/local/bin/rclone
          rclone version

      - name: Back up Supabase to encrypted R2 snapshot
        run: scripts/backup-supabase-to-r2.sh
